const r=await sb.rpc('my_household');if(r.error){$('lgc').style.display='block';$('lgM').textContent='家計の情報を読み込めませんでした（'+(r.error.message||r.error.code)+'）';return}
const h=Array.isArray(r.data)?r.data[0]:r.data;
if(!h||!h.id){$('hc').style.display='block';$('lgM').textContent='';return}
SY.hid=h.id;SY.code=h.invite_code;await begin(0)}
async function begin(fresh){if(!await syStart()){$('lgM').textContent=SY.err||'データを読み込めませんでした';return}
$('hc').style.display='none';$('lg').style.display='none';if(fresh)S.tab=5;R();if(fresh)T('はじめに、2人の名前を入れてください')}
const hmsg=e=>{const m=(e&&e.message)||'';return m.includes('invalid_code')?'招待コードが見つかりません。もう一度確認してください。':m.includes('household_full')?'この家計には、すでに2人が参加しています。':m.includes('already_member')?'すでに家計に参加しています。再読み込みしてください。':'うまくいきませんでした（'+(m||(e&&e.code)||'エラー')+'）'};
async function hnew(){$('lgM').textContent='作成中…';const r=await sb.rpc('create_household');if(r.error){$('lgM').textContent=hmsg(r.error);return}SY.hid=r.data.id;SY.code=r.data.invite_code;await begin(1)}
async function hjoin(){const c=$('hcode').value.trim();if(!c){$('lgM').textContent='招待コードを入力してください';return}$('lgM').textContent='参加中…';const r=await sb.rpc('join_household',{code:c});if(r.error){$('lgM').textContent=hmsg(r.error);return}SY.hid=r.data.id;SY.code=r.data.invite_code;await begin(0)}
async function lgin(){const e=$('lgE').value.trim(),p=$('lgP').value;if(!e||!p){$('lgM').textContent='メールアドレスとパスワードを入力してください';return}
$('lgb').disabled=true;$('lgM').textContent='ログイン中…';const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});
if(error||!data.session){$('lgM').textContent='ログインできませんでした。メールアドレスとパスワードを確認してください。';$('lgb').disabled=false;return}
await enter(data.session);$('lgb').disabled=false}
async function lo(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('fns')}catch(e){}location.reload()}

try{const u=URL.createObjectURL(new Blob(['\uFEFF'+csvO()],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=nmf;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);T('書き出しました')}catch(e){cshow()}}
function ny(){const ys=yrs();S.as.forEach((x,i)=>{if(!x.y)x.y=ys[i]});S.as.sort((a,b)=>a.y*12+parseInt(a.m)-(b.y*12+parseInt(b.m)))}

async function ccopy(){const c=SY.code;try{await navigator.clipboard.writeText(c);T('招待コードをコピーしました')}catch(e){try{const t=document.createElement('textarea');t.value=c;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();T(ok?'招待コードをコピーしました':'コピーできませんでした。コードを長押ししてコピーしてください')}catch(e2){T('コピーできませんでした。コードを長押ししてコピーしてください')}}}
